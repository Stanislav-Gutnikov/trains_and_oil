name: CI
on:
   # События, которые запускают jobs
    push:
      branches: [ "docker" ]


# jobs запускаются параллельно, если не указана последовательность
jobs:
    # Название job вы можете назвать как угодно
  tests:
    # «Раннер» — создание изолированного окружения с последней версией Ubuntu 
    runs-on: ubuntu-latest
        # Шаги
    steps:
          # Actions от github: проверяет репозиторий, гит и т.д.
    - uses: actions/checkout@v3
    - name: Run a one-line script
      run: echo "Hello, world!"

  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        # Проверка доступности репозитория Docker Hub для workflow
        uses: actions/checkout@v2 
      - name: Set up Docker Buildx
        # Вызов сборщика контейнеров docker
        uses: docker/setup-buildx-action@v1 
      - name: Login to Docker 
        # Запуск скрипта авторизации на Docker Hub
        uses: docker/login-action@v1 
        with:
          username: stanislavgutnikov
          password: Wind0654W
      - name: Push to Docker Hub
        # Пуш образа в Docker Hub 
        uses: docker/build-push-action@v2 
        with:
          push: true
          tags: stanislavgutnikov/trains_and_oil:latest
  
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
    - name: executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: 84.201.145.6
        username: gutnikov
        key: ${{ secrets.DEPLOY_KEY }}
        passphrase: Wind0654W # Если ваш ssh-ключ защищён фразой-паролем
        script: |
          # Выполняет pull образа с DockerHub
          sudo docker pull stanislavgutnikov/trains_and_oil:latest
          #остановка всех контейнеров
          sudo docker stop $(sudo docker ps -a -q)
          sudo docker run --rm -d -p 8000:80 stanislavgutnikov/trains_and_oil:latest